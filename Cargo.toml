[package]
name = "piiguard"
version = "0.1.0"
edition = "2024"
description = "PII detection with checksum validation and reversible pseudonymization, for LLM gateway hot paths"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
clap = { version = "4.6.10", features = ["derive"], optional = true }

[features]
default = ["cli"]
serde = ["dep:serde", "dep:serde_json"]
cli = ["serde", "dep:clap"]

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"

[[bin]]
name = "piiguard"
path = "src/bin/piiguard.rs"
required-features = ["cli"]

[[bench]]
name = "analyze"
harness = false
