[package]
name = "piiguard-bench-runners"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cloakpipe-core = "0.15.0"
llm-pii-redact = "0.1.0"
pii-vault = "0.2.0"
pii-veil-core = "1.0.0"
piiguard = { path = "../..", default-features = false, features = ["serde"] }
presidio-analyzer = "0.1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
